name: Build All Proton LinUwUx

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Copy Patch to workspace
      run: mkdir -p patch-repo && cp LinUwUx.patch patch-repo/ || true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential git curl wget python3 python3-pip \
          flex bison libssl-dev libelf-dev zlib1g-dev libglib2.0-dev \
          libpulse-dev libasound2-dev libfreetype6-dev libfontconfig1-dev \
          cmake ninja-build gettext autoconf automake libtool sed

    - name: Configure git for rate-limit handling
      run: |
        git config --global url."https://github.com/libarchive/bzip2.git".insteadOf "https://sourceware.org/git/bzip2.git"
        git config --global http.maxRequests 1
        git config --global http.postBuffer 157286400
        git config --global http.lowSpeedLimit 0
        git config --global http.lowSpeedTime 999999

    - name: Build Proton-GE
      run: |
        cd ${{ github.workspace }}
        git clone https://github.com/GloriousEggroll/proton-ge-custom.git proton-ge-custom
        cd proton-ge-custom
        # Rewrite .gitmodules to use GitHub mirror for bzip2
        sed -i 's|https://sourceware.org/git/bzip2.git|https://github.com/libarchive/bzip2.git|g' .gitmodules
        for i in {1..5}; do git submodule update --init --recursive && break || sleep $((i * 60)); done
        ./patches/protonprep-valve-staging.sh &> patchlog.txt
        patch -p1 < ../patch-repo/LinUwUx.patch
        export CCACHE_DISABLE=1
        mkdir build && cd build
        ../configure.sh
        make -j$(nproc) redist
        for f in *.tar.xz; do
          mv "$f" "../${f%.tar.xz}-LinUwUx.tar.xz"
        done

    - name: Build Proton-CachyOS
      run: |
        cd ${{ github.workspace }}
        git clone https://github.com/CachyOS/proton-cachyos.git proton-cachyos
        cd proton-cachyos
        # Rewrite .gitmodules to use GitHub mirror for bzip2
        sed -i 's|https://sourceware.org/git/bzip2.git|https://github.com/libarchive/bzip2.git|g' .gitmodules
        for i in {1..5}; do git submodule update --init --recursive && break || sleep $((i * 60)); done
        find . -name "*.rej" -delete
        patch -p1 < ../patch-repo/LinUwUx.patch
        export CCACHE_DISABLE=1
        mkdir -p build/release
        cd build/release
        ../../configure.sh
        make -j$(nproc) redist
        for f in *.tar.xz; do
          mv "$f" "../../../${f%.tar.xz}-LinUwUx.tar.xz"
        done

    - name: List built artifacts
      run: ls -l ${{ github.workspace }}/*-LinUwUx.tar.xz || true

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: proton-linuwux-builds
        path: ${{ github.workspace }}/*-LinUwUx.tar.xz

    - name: Get Current Date
      id: date
      run: echo "date=$(date +'%d/%m/%Y')" >> $GITHUB_OUTPUT

    - name: Get Tag Version
      id: tag
      run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: LinUwUx Proton Builds ${{ steps.tag.outputs.tag }} (${{ steps.date.outputs.date }})
        prerelease: true
        files: ${{ github.workspace }}/*-LinUwUx.tar.xz
        body: |
          Test build.
          - Proton-GE LinUwUx
          - Proton-CachyOS LinUwUx
