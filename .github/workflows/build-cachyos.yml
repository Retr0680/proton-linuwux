name: Build Proton-CachyOS LinUwUx

on:
  workflow_dispatch:
    inputs:
      upstream_release:
        description: "Upstream Proton-CachyOS SLR release tag or GitHub release URL"
        required: true
        type: string

concurrency:
  group: build-cachyos
  cancel-in-progress: false

env:
  LINUWUX_BUILD_SUFFIX: "-Rework"

jobs:
  build-cachyos:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected upstream release
        id: release-check
        env:
          UPSTREAM_RELEASE: ${{ inputs.upstream_release }}
        run: |
          set -euo pipefail
          RELEASE_INPUT="${UPSTREAM_RELEASE%/}"
          if [[ "$RELEASE_INPUT" =~ ^https://github\.com/CachyOS/proton-cachyos/releases/tag/([^/]+)$ ]]; then
            CACHYOS_TAG="${BASH_REMATCH[1]}"
          else
            CACHYOS_TAG="$RELEASE_INPUT"
          fi

          if [[ -z "$CACHYOS_TAG" ]]
          then
            echo "Errore: impossibile rilevare l'ultima release Proton-CachyOS."
            exit 1
          fi

          RELEASE_TAG="${CACHYOS_TAG}-LinUwUx${LINUWUX_BUILD_SUFFIX}"

          echo "Release upstream: $CACHYOS_TAG"
          echo "Release LinUwUx prevista: $RELEASE_TAG"

          if ! git ls-remote --exit-code --tags "https://github.com/CachyOS/proton-cachyos.git" "refs/tags/$CACHYOS_TAG" >/dev/null 2>&1
          then
            echo "Error: upstream Proton-CachyOS tag does not exist: $CACHYOS_TAG"
            exit 1
          fi

          echo "upstream-tag=$CACHYOS_TAG" >> "$GITHUB_OUTPUT"
          echo "should-build=true" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        if: steps.release-check.outputs.should-build == 'true'
        run: chmod +x scripts/*.sh

      - name: Free disk space
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          docker system prune -af || true

          df -h

      - name: Check Docker
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          which docker || true
          docker --version || true
          docker info || true

      - name: Install dependencies
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          ./scripts/install-deps.sh

      - name: Build Proton-CachyOS
        if: steps.release-check.outputs.should-build == 'true'
        env:
          CACHYOS_TAG: ${{ steps.release-check.outputs.upstream-tag }}
        run: |
          ./scripts/build-cachyos.sh "$CACHYOS_TAG"

      - name: Generate Proton-CachyOS SHA-256 checksum
        if: steps.release-check.outputs.should-build == 'true' && success()
        run: |
          shopt -s nullglob

          archives=(output/cachyos-*-slr-LinUwUx${LINUWUX_BUILD_SUFFIX}.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
          )

          echo "Checksum generato:"
          cat "$checksum"

      - name: Upload Proton-CachyOS artifact
        if: steps.release-check.outputs.should-build == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-LinUwUx
          path: |
            output/cachyos-*-slr-LinUwUx${{ env.LINUWUX_BUILD_SUFFIX }}.tar.gz
            output/cachyos-*-slr-LinUwUx${{ env.LINUWUX_BUILD_SUFFIX }}.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Proton-CachyOS release
        if: steps.release-check.outputs.should-build == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          archives=(output/cachyos-*-slr-LinUwUx${LINUWUX_BUILD_SUFFIX}.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          if [ ! -f "$checksum" ]
          then
            echo "Errore: file SHA-256 non trovato:"
            echo "$checksum"
            exit 1
          fi

          filename="$(basename "$archive")"
          release_tag="${filename%.tar.gz}"
          base_release="${release_tag%-LinUwUx${LINUWUX_BUILD_SUFFIX}}"

          echo "Archivio: $archive"
          echo "Checksum: $checksum"
          echo "Tag Release: $release_tag"

          notes="$(
            printf '%s\n' \
              'Automatically built from the latest Proton-CachyOS release.' \
              '' \
              '## Base' \
              '' \
              "- $base_release" \
              '' \
              '## LinUwUx integration' \
              '' \
              '- LinUwUx integration ported directly into the Proton and Wine source trees.' \
              '' \
              '## Credits' \
              '' \
              'Proton-CachyOS: [CachyOS/proton-cachyos](https://github.com/CachyOS/proton-cachyos)' \
              'LinUwUx: [A Hypervisor(-less) Denuvo bypass for Linux](https://cs.rin.ru/forum/viewtopic.php?f=10&t=159989)' \
              '' \
              '_Built automatically with GitHub Actions._'
          )"

          if gh release view "$release_tag" >/dev/null 2>&1
          then
            echo "La Release esiste già: aggiorno descrizione e file allegati."

            gh release edit \
              "$release_tag" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest

            gh release upload \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --clobber
          else
            echo "Creazione nuova Release."

            gh release create \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest
          fi
