name: Build Proton-CachyOS LinUwUx

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

jobs:
  build-cachyos:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether a new build is needed
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CACHYOS_TAG="$(
            curl -fsSL \
              https://api.github.com/repos/CachyOS/proton-cachyos/releases/latest |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])'
          )"

          if [[ -z "$CACHYOS_TAG" ]]
          then
            echo "Errore: impossibile rilevare l'ultima release Proton-CachyOS."
            exit 1
          fi

          CACHYOS_VERSION="${CACHYOS_TAG#cachyos-}"
          CACHYOS_VERSION="${CACHYOS_VERSION%-slr}"

          RELEASE_TAG="proton-cachyos-${CACHYOS_VERSION}-slr-LinUwUx"

          echo "Release upstream: $CACHYOS_TAG"
          echo "Release LinUwUx prevista: $RELEASE_TAG"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]
          then
            echo "Avvio manuale: la build verrà eseguita comunque."
            echo "should-build=true" >> "$GITHUB_OUTPUT"

          elif git ls-remote \
            --exit-code \
            --tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$RELEASE_TAG" \
            >/dev/null
          then
            echo "La Release LinUwUx esiste già: nessuna compilazione necessaria."
            echo "should-build=false" >> "$GITHUB_OUTPUT"

          else
            echo "Nuova Release rilevata: avvio della compilazione."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Make scripts executable
        if: steps.release-check.outputs.should-build == 'true'
        run: chmod +x scripts/*.sh

      - name: Free disk space
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          docker system prune -af || true

          df -h

      - name: Check Docker
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          which docker || true
          docker --version || true
          docker info || true

      - name: Install dependencies
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          ./scripts/install-deps.sh

      - name: Build Proton-CachyOS
        if: steps.release-check.outputs.should-build == 'true'
        env:
        run: |
          ./scripts/build-cachyos.sh

      - name: Generate Proton-CachyOS SHA-256 checksum
        if: steps.release-check.outputs.should-build == 'true' && success()
        run: |
          shopt -s nullglob

          archives=(output/proton-cachyos-*-slr-LinUwUx.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
          )

          echo "Checksum generato:"
          cat "$checksum"

      - name: Upload Proton-CachyOS artifact
        if: steps.release-check.outputs.should-build == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Proton-CachyOS-LinUwUx
          path: |
            output/proton-cachyos-*-slr-LinUwUx.tar.gz
            output/proton-cachyos-*-slr-LinUwUx.tar.gz.sha256
          if-no-files-found: error

      - name: Publish Proton-CachyOS release
        if: steps.release-check.outputs.should-build == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          archives=(output/proton-cachyos-*-slr-LinUwUx.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          if [ ! -f "$checksum" ]
          then
            echo "Errore: file SHA-256 non trovato:"
            echo "$checksum"
            exit 1
          fi

          filename="$(basename "$archive")"
          release_tag="${filename%.tar.gz}"
          base_release="${release_tag%-LinUwUx}"

          echo "Archivio: $archive"
          echo "Checksum: $checksum"
          echo "Tag Release: $release_tag"

          notes="$(
            printf '%s\n' \
              'Automatically built from the latest Proton-CachyOS release.' \
              '' \
              '## Base' \
              '' \
              "- $base_release" \
              '' \
              '## Patch' \
              '' \
              '- LinUwUx.patch (required for the Hypervisor-less Denuvo bypass on Linux).' \
              '' \
              '## Credits' \
              '' \
              'Proton-CachyOS: [CachyOS/proton-cachyos](https://github.com/CachyOS/proton-cachyos)' \
              'LinUwUx: [A Hypervisor(-less) Denuvo bypass for Linux](https://cs.rin.ru/forum/viewtopic.php?f=10&t=159989)' \
              '' \
              '_Built automatically with GitHub Actions._'
          )"

          if gh release view "$release_tag" >/dev/null 2>&1
          then
            echo "La Release esiste già: aggiorno descrizione e file allegati."

            gh release edit \
              "$release_tag" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest

            gh release upload \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --clobber
          else
            echo "Creazione nuova Release."

            gh release create \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest
          fi
