name: Build Proton-GE LinUwUx

on:
  workflow_dispatch:
    inputs:
      upstream_release:
        description: "Upstream Proton-GE release tag or GitHub release URL"
        required: true
        type: string

concurrency:
  group: build-ge
  cancel-in-progress: false

env:
  LINUWUX_BUILD_SUFFIX: "-Rework"

jobs:
  build-ge:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate selected upstream release
        id: release-check
        env:
          UPSTREAM_RELEASE: ${{ inputs.upstream_release }}
        run: |
          set -euo pipefail
          RELEASE_INPUT="${UPSTREAM_RELEASE%/}"
          if [[ "$RELEASE_INPUT" =~ ^https://github\.com/GloriousEggroll/proton-ge-custom/releases/tag/([^/]+)$ ]]; then
            GE_TAG="${BASH_REMATCH[1]}"
          else
            GE_TAG="$RELEASE_INPUT"
          fi

          if [[ -z "$GE_TAG" ]]
          then
            echo "Errore: impossibile rilevare l'ultima release Proton-GE."
            exit 1
          fi

          if [[ "$GE_TAG" != GE-Proton* ]]
          then
            echo "Errore: il tag rilevato non sembra appartenere a Proton-GE:"
            echo "$GE_TAG"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags "https://github.com/GloriousEggroll/proton-ge-custom.git" "refs/tags/$GE_TAG" >/dev/null 2>&1
          then
            echo "Error: upstream Proton-GE tag does not exist: $GE_TAG"
            exit 1
          fi

          if ! git ls-remote --exit-code --tags "https://github.com/GloriousEggroll/proton-ge-custom.git" "refs/tags/$GE_TAG" >/dev/null 2>&1; then
            echo "Error: upstream Proton-GE tag does not exist: $GE_TAG"
            exit 1
          fi

          RELEASE_TAG="${GE_TAG}-LinUwUx${LINUWUX_BUILD_SUFFIX}"

          echo "Release upstream: $GE_TAG"
          echo "Release LinUwUx prevista: $RELEASE_TAG"

          echo "upstream-tag=$GE_TAG" >> "$GITHUB_OUTPUT"
          echo "should-build=true" >> "$GITHUB_OUTPUT"

      - name: Make scripts executable
        if: steps.release-check.outputs.should-build == 'true'
        run: chmod +x scripts/*.sh

      - name: Free disk space
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

          docker system prune -af || true

          df -h

      - name: Check Docker
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          which docker || true
          docker --version || true
          docker info || true

      - name: Install dependencies
        if: steps.release-check.outputs.should-build == 'true'
        run: |
          ./scripts/install-deps.sh

      - name: Build Proton-GE
        if: steps.release-check.outputs.should-build == 'true'
        env:
          GE_TAG: ${{ steps.release-check.outputs.upstream-tag }}
        run: |
          ./scripts/build-ge.sh "$GE_TAG"

      - name: Generate Proton-GE SHA-256 checksum
        if: steps.release-check.outputs.should-build == 'true' && success()
        run: |
          shopt -s nullglob

          archives=(output/GE-Proton*-LinUwUx${LINUWUX_BUILD_SUFFIX}.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$checksum")"
          )

          echo "Checksum generato:"
          cat "$checksum"

      - name: Upload Proton-GE artifact
        if: steps.release-check.outputs.should-build == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: GE-Proton-LinUwUx
          path: output/
          if-no-files-found: error

      - name: Publish Proton-GE release
        if: steps.release-check.outputs.should-build == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          archives=(output/GE-Proton*-LinUwUx${LINUWUX_BUILD_SUFFIX}.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
            echo "Errore: atteso esattamente un archivio .tar.gz in output/."
            ls -lah output/
            exit 1
          fi

          archive="${archives[0]}"
          checksum="${archive}.sha256"

          if [ ! -f "$checksum" ]
          then
            echo "Errore: file SHA-256 non trovato:"
            echo "$checksum"
            exit 1
          fi

          filename="$(basename "$archive")"
          release_tag="${filename%.tar.gz}"
          base_release="${release_tag%-LinUwUx${LINUWUX_BUILD_SUFFIX}}"

          echo "Archivio: $archive"
          echo "Tag Release: $release_tag"

          notes="$(
            printf '%s\n' \
              'Automatically built from the latest Proton-GE release.' \
              '' \
              '## Base' \
              '' \
              "- $base_release" \
              '' \
              '## LinUwUx integration' \
              '' \
              '- LinUwUx integration ported directly into the Proton and Wine source trees.' \
              '' \
              '## Credits' \
              '' \
              'Proton-GE: [GloriousEggroll/proton-ge-custom](https://github.com/GloriousEggroll/proton-ge-custom)' \
              'LinUwUx: [A Hypervisor(-less) Denuvo bypass for Linux](https://cs.rin.ru/forum/viewtopic.php?f=10&t=159989)' \
              '' \
              '_Built automatically with GitHub Actions._'
          )"

          if gh release view "$release_tag" >/dev/null 2>&1
          then
            echo "La Release esiste già: aggiorno descrizione e file allegato."

            gh release edit \
              "$release_tag" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest

            gh release upload \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --clobber
          else
            echo "Creazione nuova Release."

            gh release create \
              "$release_tag" \
              "$archive" \
              "$checksum" \
              --title "$release_tag" \
              --notes "$notes" \
              --latest
          fi

      - name: Upload diagnostic logs
        if: always() && steps.release-check.outputs.should-build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GE-Proton-build-logs
          path: |
            build-ge.log
            work/proton-ge-custom/patchlog.txt
          if-no-files-found: warn
          retention-days: 7
