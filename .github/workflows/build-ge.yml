name: Build Proton-GE LinUwUx

on:
  workflow_dispatch:

jobs:
  build-ge:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker system prune -af || true
          df -h

      - name: Check Docker
        run: |
         which docker || true
         docker --version || true
         docker info || true

      - name: Install dependencies
        run: |
          ./scripts/install-deps.sh

      - name: Build Proton-GE
        env:
          CCACHE_DISABLE: "1"
        run: |
          ./scripts/build-ge.sh

      - name: Upload Proton-GE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GE-Proton-LinUwUx
          path: output/
          if-no-files-found: error

      - name: Publish Proton-GE release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob

          archives=(output/GE-Proton*-LinUwUx.tar.gz)

          if [ "${#archives[@]}" -ne 1 ]
          then
              echo "Errore: atteso esattamente un archivio .tar.gz in output/."
              ls -lah output/
              exit 1
          fi

          archive="${archives[0]}"
          filename="$(basename "$archive")"
          release_tag="${filename%.tar.gz}"

          echo "Archivio: $archive"
          echo "Tag Release: $release_tag"

          if gh release view "$release_tag" >/dev/null 2>&1
          then
              echo "La Release esiste già: aggiorno il file allegato."

              gh release upload \
                  "$release_tag" \
                  "$archive" \
                  --clobber
          else
              echo "Creazione nuova Release."

              gh release create \
                  "$release_tag" \
                  "$archive" \
                  --title "$release_tag" \
                  --notes "Build automatica di Proton-GE con LinUwUx.patch." \
                  --latest
          fi

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GE-Proton-build-logs
          path: |
            build-ge.log
            work/proton-ge-custom/patchlog.txt
          if-no-files-found: warn
          retention-days: 7
